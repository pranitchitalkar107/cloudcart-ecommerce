<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - E-Commerce</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--blue:#2563eb;--muted:#64748b}
body.dark{--bg:#111827;--card:#1f2937;--text:#f9fafb;--muted:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:var(--card);padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 10px #0001}
.logo{font-size:24px;font-weight:bold;color:var(--blue)}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-size:14px}
.primary{background:var(--blue);color:white}
.secondary{background:#e0eaff;color:#1d4ed8}
input,select,textarea{padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:var(--card);color:var(--text);font:inherit}
.hero{padding:40px 5%;color:white;background:linear-gradient(120deg,#2563eb,#9333ea)}
.hero h1{font-size:clamp(28px,5vw,44px)}
main{padding:24px 5%}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar input{flex:1;min-width:160px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:18px}
.card,.panel{background:var(--card);border-radius:13px;box-shadow:0 3px 14px #0000000c;overflow:hidden}
.product-image{height:150px;display:grid;place-items:center;font-size:65px;background:#eaf0ff}
.content{padding:15px}
.price{font-size:21px;font-weight:bold;margin:12px 0}
.muted{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
.panel{padding:20px;margin-top:25px}
.cart-row,.order-row{padding:12px 0;border-bottom:1px solid #94a3b833;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:8px}
.qty button{background:#e0eaff;color:#1d4ed8}
.total{font-size:22px;font-weight:bold}
#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px 20px;border-radius:9px;display:none;z-index:20}
dialog{width:min(440px,92%);border:0;border-radius:14px;padding:24px;background:var(--card);color:var(--text)}
dialog::backdrop{background:#0009}
footer{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:500px){main{padding:18px 4%}.hero{padding:28px 4%}}
</style>
</head>
<body>
<header>
 <div class="logo">🛍️ ShopEase</div>
 <div class="actions">
  <button class="secondary" onclick="go('cart')">🛒 <span id="count">0</span></button>
  <button class="secondary" onclick="go('wishlist')">❤️ <span id="wishCount">0</span></button>
  <button class="secondary" onclick="toggleTheme()">🌙 Theme</button>
 </div>
</header>

<section class="hero">
 <h1>Smart Shopping Starts Here!</h1>
 <p>Explore products, save favorites and enjoy special offers.</p>
 <button class="primary" onclick="go('shop')">Explore Products →</button>
</section>

<main>
 <h2 id="shop">Explore Products</h2>
 <div class="toolbar">
  <input id="search" placeholder="🔍 Search products..." oninput="renderProducts()">
  <select id="category" onchange="renderProducts()">
   <option>All</option>
   <option>Electronics</option>
   <option>Fashion</option>
   <option>Home</option>
   <option>Accessories</option>
  </select>
  <select id="sort" onchange="renderProducts()">
   <option value="default">Sort products</option>
   <option value="low">Price: Low to High</option>
   <option value="high">Price: High to Low</option>
   <option value="rating">Top Rated</option>
  </select>
 </div>
 <div id="products" class="products"></div>

 <section id="wishlist" class="panel">
  <h2>❤️ My Wishlist</h2>
  <div id="wishlistItems"></div>
 </section>

 <section id="cart" class="panel">
  <h2>🛒 Shopping Cart</h2>
  <div id="cartItems"></div>
  <hr>
  <p>Coupon: <strong>SAVE10</strong> for 10% off</p>
  <div class="toolbar">
   <input id="coupon" placeholder="Enter coupon code">
   <button class="secondary" onclick="applyCoupon()">Apply Coupon</button>
  </div>
  <p id="discountInfo" class="muted"></p>
  <p>Subtotal: ₹<span id="subtotal">0</span></p>
  <p>Discount: ₹<span id="discount">0</span></p>
  <p class="total">Total: ₹<span id="total">0</span></p>
  <button class="primary" onclick="checkout()">Checkout</button>
  <button class="secondary" onclick="clearCart()">Clear Cart</button>
 </section>

 <section id="orders" class="panel">
  <h2>📦 Order History</h2>
  <div id="orderHistory"></div>
 </section>
</main>

<dialog id="details">
 <div id="detailContent"></div>
 <button class="secondary" onclick="document.getElementById('details').close()">Close</button>
</dialog>
<div id="notice"></div>
<footer>ShopEase © 2026 | E-Commerce Mini Project</footer>

<script>
const products=[
{id:1,name:"Smartphone",category:"Electronics",price:14999,emoji:"📱",rating:4.5,description:"A modern smartphone for everyday use."},
{id:2,name:"Laptop",category:"Electronics",price:45999,emoji:"💻",rating:4.8,description:"A laptop for study and productivity."},
{id:3,name:"Headphones",category:"Electronics",price:1999,emoji:"🎧",rating:4.3,description:"Enjoy your favorite music."},
{id:4,name:"Smart Watch",category:"Accessories",price:2499,emoji:"⌚",rating:4.2,description:"Track your activities in style."},
{id:5,name:"T-Shirt",category:"Fashion",price:599,emoji:"👕",rating:4.1,description:"Comfortable casual wear."},
{id:6,name:"Shoes",category:"Fashion",price:1799,emoji:"👟",rating:4.4,description:"Everyday footwear."},
{id:7,name:"Backpack",category:"Accessories",price:999,emoji:"🎒",rating:4.2,description:"Carry your daily essentials."},
{id:8,name:"Table Lamp",category:"Home",price:799,emoji:"💡",rating:4.0,description:"A useful lamp for your desk."},
{id:9,name:"Coffee Mug",category:"Home",price:299,emoji:"☕",rating:4.6,description:"A mug for your favorite drink."},
{id:10,name:"Camera",category:"Electronics",price:12999,emoji:"📷",rating:4.7,description:"Capture your favorite moments."},
{id:11,name:"Sunglasses",category:"Fashion",price:499,emoji:"🕶️",rating:4.1,description:"A stylish everyday accessory."},
{id:12,name:"Keyboard",category:"Electronics",price:1299,emoji:"⌨️",rating:4.3,description:"A keyboard for your computer."}
];

function load(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))??fallback}
 catch(e){return fallback}
}
let cart=load("se_cart",[]);
let wishlist=load("se_wishlist",[]);
let orders=load("se_orders",[]);
let couponApplied=false;

function save(){
 localStorage.setItem("se_cart",JSON.stringify(cart));
 localStorage.setItem("se_wishlist",JSON.stringify(wishlist));
 localStorage.setItem("se_orders",JSON.stringify(orders));
}
function money(n){
 return Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
}
function notify(message){
 const el=document.getElementById("notice");
 el.textContent=message;
 el.style.display="block";
 setTimeout(()=>el.style.display="none",2200);
}
function go(id){
 document.getElementById(id).scrollIntoView({behavior:"smooth"});
}
function toggleTheme(){
 document.body.classList.toggle("dark");
 localStorage.setItem("se_dark",document.body.classList.contains("dark"));
}
if(load("se_dark",false))document.body.classList.add("dark");

function renderProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 const category=document.getElementById("category").value;
 let list=products.filter(p=>
  p.name.toLowerCase().includes(q)&&
  (category==="All"||p.category===category)
 );
 const sort=document.getElementById("sort").value;
 if(sort==="low")list.sort((a,b)=>a.price-b.price);
 if(sort==="high")list.sort((a,b)=>b.price-a.price);
 if(sort==="rating")list.sort((a,b)=>b.rating-a.rating);

 document.getElementById("products").innerHTML=list.length?
 list.map(p=>`
 <article class="card">
  <div class="product-image">${p.emoji}</div>
  <div class="content">
   <p class="muted">${p.category}</p>
   <h3>${p.name}</h3>
   <p>⭐ ${p.rating}/5</p>
   <div class="price">₹${money(p.price)}</div>
   <div class="actions">
    <button class="secondary" onclick="details(${p.id})">Details</button>
    <button class="secondary" onclick="wish(${p.id})">${wishlist.includes(p.id)?"❤️":"🤍"}</button>
   </div>
   <p><button class="primary" onclick="add(${p.id})">Add to Cart</button></p>
  </div>
 </article>`).join(""):"<p>No products found.</p>";
}

function add(id){
 const item=cart.find(x=>x.id===id);
 if(item)item.qty++;
 else cart.push({id,qty:1});
 save();renderCart();notify("Product added to cart!");
}
function changeQty(id,amount){
 const item=cart.find(x=>x.id===id);
 if(!item)return;
 item.qty+=amount;
 if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
 save();renderCart();
}
function removeItem(id){
 cart=cart.filter(x=>x.id!==id);
 save();renderCart();notify("Product removed.");
}
function wish(id){
 if(wishlist.includes(id))wishlist=wishlist.filter(x=>x!==id);
 else wishlist.push(id);
 save();renderProducts();renderWishlist();
}
function renderWishlist(){
 document.getElementById("wishCount").textContent=wishlist.length;
 document.getElementById("wishlistItems").innerHTML=wishlist.length?
 wishlist.map(id=>{
  const p=products.find(x=>x.id===id);
  if(!p)return "";
  return `<div class="cart-row">
   <span>${p.emoji} ${p.name} — ₹${money(p.price)}</span>
   <div class="actions">
    <button class="primary" onclick="add(${id})">Add to Cart</button>
    <button class="secondary" onclick="wish(${id})">Remove ❤️</button>
   </div>
  </div>`;
 }).join(""):"<p class='muted'>Your wishlist is empty.</p>";
}
function details(id){
 const p=products.find(x=>x.id===id);
 document.getElementById("detailContent").innerHTML=`
 <div style="font-size:65px;text-align:center">${p.emoji}</div>
 <h2>${p.name}</h2>
 <p>${p.description}</p>
 <p>Category: ${p.category}</p>
 <p>Rating: ⭐ ${p.rating}/5</p>
 <h3>₹${money(p.price)}</h3>
 <button class="primary" onclick="add(${id});document.getElementById('details').close()">Add to Cart</button>`;
 document.getElementById("details").showModal();
}
function subtotal(){
 return cart.reduce((sum,item)=>{
  const p=products.find(x=>x.id===item.id);
  return sum+(p?p.price*item.qty:0);
 },0);
}
function applyCoupon(){
 const code=document.getElementById("coupon").value.trim().toUpperCase();
 couponApplied=code==="SAVE10";
 notify(couponApplied?"10% discount applied!":"Invalid coupon code.");
 renderCart();
}
function renderCart(){
 document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("cartItems").innerHTML=cart.length?
 cart.map(item=>{
  const p=products.find(x=>x.id===item.id);
  if(!p)return "";
  return `<div class="cart-row">
   <span>${p.emoji} <strong>${p.name}</strong><br>₹${money(p.price)} each</span>
   <div class="qty">
    <button onclick="changeQty(${p.id},-1)">−</button>
    <span>${item.qty}</span>
    <button onclick="changeQty(${p.id},1)">+</button>
    <button onclick="removeItem(${p.id})">🗑️</button>
   </div>
   <strong>₹${money(p.price*item.qty)}</strong>
  </div>`;
 }).join(""):"<p class='muted'>Your cart is empty.</p>";

 const sub=subtotal();
 const disc=couponApplied?sub*.10:0;
 document.getElementById("subtotal").textContent=money(sub);
 document.getElementById("discount").textContent=money(disc);
 document.getElementById("total").textContent=money(sub-disc);
 document.getElementById("discountInfo").textContent=
 couponApplied?"SAVE10 applied: 10% off":"";
}
function clearCart(){
 if(!cart.length)return notify("Your cart is already empty.");
 if(!confirm("Clear all items from your cart?"))return;
 cart=[];couponApplied=false;
 document.getElementById("coupon").value="";
 save();renderCart();notify("Cart cleared.");
}
function checkout(){
 if(!cart.length)return notify("Add products to your cart first.");
 const name=prompt("Enter your name for the demo order:");
 if(!name||!name.trim())return;
 const address=prompt("Enter delivery address:");
 if(!address||!address.trim())return;
 const sub=subtotal();
 const discount=couponApplied?sub*.10:0;
 orders.unshift({
  id:"SE"+Date.now().toString().slice(-8),
  date:new Date().toLocaleString(),
  name:name.trim(),
  address:address.trim(),
  items:cart.map(x=>({...x})),
  total:Math.round((sub-discount)*100)/100,
  status:"Demo order placed"
 });
 cart=[];couponApplied=false;
 document.getElementById("coupon").value="";
 save();renderCart();renderOrders();
 notify("Demo order placed successfully!");
 go("orders");
}
function renderOrders(){
 document.getElementById("orderHistory").innerHTML=orders.length?
 orders.map(o=>`
 <div class="order-row">
  <div>
   <strong>Order #${o.id}</strong><br>
   <span class="muted">${o.date}</span><br>
   <span>${o.items.reduce((s,x)=>s+x.qty,0)} item(s) · ${o.status}</span>
  </div>
  <strong>₹${money(o.total)}</strong>
 </div>`).join(""):"<p class='muted'>No orders yet.</p>";
}

renderProducts();
renderWishlist();
renderCart();
renderOrders();
</script>
</body>
</html>
